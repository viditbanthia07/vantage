<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage — video analytics that says when it does not know</title>
    <meta
      name="description"
      content="An open-source platform that understands what happens in video over time: tracking, activity, spatial reasoning and historical baselines, with every reading it cannot make reported rather than guessed."
    />
    <meta name="theme-color" content="#14110d" />
    <meta name="color-scheme" content="dark" />

    <!-- No og:image. The obvious one would be a frame of somebody walking down a
         street, and the page's argument is precisely that we do not publish
         those. A card with a title and a sentence in it is the honest version. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vantage" />
    <meta
      property="og:description"
      content="Video analytics that says when it does not know. Open source, runs on a laptop, identifies nobody by default."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      The favicon is inline SVG rather than a file: one fewer request, and it
      is the only mark the page has - the twin's floor plan seen from above,
      with one entity on it.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314110d'/%3E%3Crect x='5.5' y='7.5' width='21' height='17' fill='none' stroke='%23B08D57' stroke-width='1.5'/%3E%3Cpath d='M16 7.5v17' stroke='%23B08D57' stroke-width='1' opacity='0.4'/%3E%3Ccircle cx='11' cy='17' r='2.5' fill='%23B33A2E'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 38rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6">
        <h1 style="font-family: Georgia, serif">Vantage</h1>
        <p>
          A modular platform for understanding what happens in video over time — tracking,
          activity, spatial reasoning and historical baselines — that reports the readings it
          cannot make rather than guessing them. It identifies nobody by default.
        </p>
        <p>
          This page's narrative is built with JavaScript. The whole of it, and rather more, is
          in the README:
          <a href="https://github.com/viditbanthia07/vantage" style="color: #b08d57">
            github.com/viditbanthia07/vantage </a
          >.
        </p>
        <p style="font-family: monospace">
          pip install -e . &amp;&amp; vantage run --source "synthetic://?objects=3" --dashboard
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
